name: Build and Publish

on: [push, pull_request]

env:
  PLUTOBOOK_VERSION: 0.21.0
jobs:
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist -Csetup-args=-Dsdist=true

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz

  build_linux_wheels:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:wheels]')
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: |
            cp310-manylinux_x86_64
            cp311-manylinux_x86_64
            cp312-manylinux_x86_64
            cp313-manylinux_x86_64
            cp314-manylinux_x86_64
            cp315-manylinux_x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            mkdir -p /plutobook &&
            curl -L https://github.com/plutoprint/plutobook/releases/download/v${{ env.PLUTOBOOK_VERSION }}/plutobook-${{ env.PLUTOBOOK_VERSION }}-linux-x64.tar.gz | tar -xz -C /plutobook &&
            cp -r /plutobook/plutobook-linux-x64/etc/fonts/* /project/fontconfig
          CIBW_CONFIG_SETTINGS_LINUX: |
            setup-args="-Dplutobook-libdir=/plutobook/plutobook-linux-x64/lib"
            setup-args="-Dplutobook-incdir=/plutobook/plutobook-linux-x64/include/plutobook"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            LD_LIBRARY_PATH=/plutobook/plutobook-linux-x64/lib
            auditwheel repair -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >
            python -c "import plutoprint; print(plutoprint.__build_info__)" &&
            python -m pytest -v {project}/tests

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-linux-wheels
          path: ./wheelhouse/*.whl

  build_windows_wheels:
    runs-on: windows-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:wheels]')
    steps:
      - uses: actions/checkout@v7
      - name: Download and Extract PlutoBook
        run: |
          curl -L https://github.com/plutoprint/plutobook/releases/download/v${{ env.PLUTOBOOK_VERSION }}/plutobook-${{ env.PLUTOBOOK_VERSION }}-win-x64.zip -o plutobook-win-x64.zip
          7z x plutobook-win-x64.zip -o"${{ runner.temp }}\plutobook"
          cp -r "${{ runner.temp }}\plutobook\plutobook-win-x64\bin\fonts\*" fontconfig

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: cp310-win_amd64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64 cp314-win_amd64 cp315-win_amd64
          CIBW_BEFORE_BUILD: pip install delvewheel
          CIBW_CONFIG_SETTINGS_WINDOWS: |
            setup-args="-Dplutobook-libdir=${{ runner.temp }}\plutobook\plutobook-win-x64\lib"
            setup-args="-Dplutobook-incdir=${{ runner.temp }}\plutobook\plutobook-win-x64\include\plutobook"
          CIBW_REPAIR_WHEEL_COMMAND: >
            delvewheel repair -vv -w {dest_dir} {wheel} --add-path ${{ runner.temp }}\plutobook\plutobook-win-x64\bin
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >
            python -c "import plutoprint; print(plutoprint.__build_info__)" &&
            python -m pytest -v {project}\tests

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-windows-wheels
          path: ./wheelhouse/*.whl

  build_macos_wheels:
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:wheels]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download and Extract PlutoBook
        run: |
          curl -L https://github.com/plutoprint/plutobook/releases/download/v${{ env.PLUTOBOOK_VERSION }}/plutobook-${{ env.PLUTOBOOK_VERSION }}-macos-arm64.tar.gz -o plutobook-macos-arm64.tar.gz
          mkdir -p "${{ runner.temp }}/plutobook"
          tar -xzf plutobook-macos-arm64.tar.gz -C "${{ runner.temp }}/plutobook"

          lib=$(realpath "${{ runner.temp }}/plutobook/plutobook-macos-arm64/lib/libplutobook.dylib")
          install_name_tool -id "$lib" "$lib"
          codesign --force --sign - "$lib"
          cp -rv "${{ runner.temp }}/plutobook/plutobook-macos-arm64/etc/fonts/"* fontconfig

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CIBW_BUILD: |
            cp310-macosx_arm64
            cp311-macosx_arm64
            cp312-macosx_arm64
            cp313-macosx_arm64
            cp314-macosx_arm64
            cp315-macosx_arm64
          CIBW_CONFIG_SETTINGS_MACOS: |
            setup-args="-Dplutobook-libdir=${{ runner.temp }}/plutobook/plutobook-macos-arm64/lib"
            setup-args="-Dplutobook-incdir=${{ runner.temp }}/plutobook/plutobook-macos-arm64/include/plutobook"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >
            python -c "import plutoprint; print(plutoprint.__build_info__)" &&
            python -m pytest -v {project}/tests

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-macos-wheels
          path: ./wheelhouse/*.whl

  publish:
    needs: [build_sdist, build_linux_wheels, build_windows_wheels, build_macos_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

      - name: Generate Release Note
        run: |
          echo "See changelog: https://plutoprint.readthedocs.io/en/latest/changelog.html#${GITHUB_REF_NAME//./-}" > RELEASENOTE.md
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: RELEASENOTE.md
          files: |
            dist/plutoprint-*.whl
            dist/plutoprint-*.tar.gz
